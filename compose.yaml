services:
  mayoauth:
    build: .
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 80
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=16m, noexec, nosuid]
    environment:
      MAYOAUTH_DATA_DIR: /data
      NODE_OPTIONS: --max-old-space-size=128
    ports: ['127.0.0.1:8787:8787']
    volumes:
      ['${MAYOAUTH_DATA_PATH:?Set MAYOAUTH_DATA_PATH to an initialized private directory}:/data']
    logging:
      driver: json-file
      options: { max-size: '5m', max-file: '2' }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
