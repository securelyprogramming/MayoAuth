<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Operator login · MayoAuth</title>
    <link rel="icon" href="/mark.svg" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/login.js" defer></script>
  </head>
  <body>
    <div class="beta-bar"><span class="beta-tag">BETA</span> Community operator console</div>
    <main class="auth-card">
      <a class="brand" href="/"
        ><img src="/mark.svg" width="32" height="32" alt="" />Mayo<span>Auth</span></a
      >
      <h1>Welcome back.</h1>
      <p>Sign in to the self-hosted instance you operate. The public demo needs no account.</p>
      <form id="login-form">
        <label>Email<input name="email" type="email" autocomplete="username" required /></label
        ><label
          >Password<input
            name="password"
            type="password"
            autocomplete="current-password"
            required
            maxlength="256" /></label
        ><button class="button primary">Sign in →</button>
        <div id="error" class="error" role="alert"></div>
      </form>
      <a href="/demo">Just exploring? Open the demo →</a>
    </main>
  </body>
</html>
